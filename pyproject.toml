[project]
name = "farfield"
version = "0.1.0"
description = "Mind awake, body asleep — binaural-beat synthesis and analysis engine"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "PyYAML>=6.0",
]

[project.scripts]
farfield = "farfield.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farfield"]

[tool.hatch.build.targets.wheel.force-include]
"farfield/viz_template.html" = "farfield/viz_template.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
